<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="RiderCards — premium playing cards">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050506"/>
      <stop offset="1" stop-color="#16161b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#A3E635" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#A3E635" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A3E635"/>
      <stop offset="1" stop-color="#84CC16"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g fill="#A3E635" opacity="0.06" font-family="serif" font-size="120">
    <text x="60" y="140">♠</text>
    <text x="1040" y="180">♥</text>
    <text x="120" y="560">♦</text>
    <text x="1010" y="560">♣</text>
  </g>

  <g transform="translate(120 195)">
    <rect width="120" height="120" rx="28" fill="url(#lime)"/>
    <g fill="#08130a" transform="translate(60 60) scale(2.6)">
      <path d="M0-18l-5 8.6a5 5 0 0 0 10 0L0-18z"/>
      <path d="M0 18l5-8.6a5 5 0 0 0-10 0L0 18z"/>
      <path d="M-18 0l8.6 5a5 5 0 0 0 0-10L-18 0z"/>
      <path d="M18 0l-8.6-5a5 5 0 0 0 0 10L18 0z"/>
    </g>
  </g>

  <text x="272" y="272" fill="#ffffff" font-family="Bebas Neue, Impact, sans-serif" font-size="88" letter-spacing="6">
